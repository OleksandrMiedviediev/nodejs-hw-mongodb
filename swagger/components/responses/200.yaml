description: Successfully logged in an user!
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully logged in an user!
        data:
          type: object
          required:
            - accessToken
          properties:
            accessToken:
              type: string
              example: '6PZwq+k+ruS4WEuP8KxiliGTqOT+8PQF8qwGrI1b'