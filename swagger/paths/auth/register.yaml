tags:
  - Auth
summary: Register user's
operationId: registerUser's
description: "Register user's"
security:
  - bearerAuth: []
requestBody:
  content:
    aplication/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: 'null@mail.com'
          password:
            description: "User's password"
            type: string
            example: 'dfn12kjl'
responses:
  '200':
    $ref: '../../components/responses/200.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'