#/swagger/paths/students/post.yaml

tags:
  - Contacts
summary: Create contacts
operationId: createContacts
description: 'Create a contacts with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's number"
            type: number
            example: 380000000011
          email:
            description: "Contact's email"
            type: string
            example: 'null@email.com'
          isFavourite:
            description: "Contact's favourite"
            type: boolean
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ["work", "home", "personal"]
            example: 'work'
          userId:
            description: "User's id created by contact"
            type: string
            example: '65e4decdd286b30065d54af9'
          photo:
            description: "Link to contact's photo"
            type: string
            example: 'https://res.cloudinary.com/diah8te11/image/upload/v1724706812/photos/zhaiqcqtobnifvgceklk.png'
responses:
  '201':
    description: 'Create contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully create a contact!'
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'

